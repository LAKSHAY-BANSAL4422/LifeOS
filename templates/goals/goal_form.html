{% extends 'base.html' %}
{% block page_title %}New Goal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Create Long-Term Goal</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Goal Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Crack a summer internship" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Category</label>
                        {{ form.category }}
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Target Date</label>
                        {{ form.target_date }}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Status</label>
                    {{ form.status }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'goals:list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Goal</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
