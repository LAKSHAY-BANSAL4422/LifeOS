{% extends 'base.html' %}
{% block page_title %}Add Milestone{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-1">Add Milestone</h5>
            <p class="text-muted small mb-3">Goal: <strong>{{ goal.title }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Milestone Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Master 200 DSA problems" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Due Date</label>
                    {{ form.due_date }}
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="completed" id="completedCheck">
                    <label class="form-check-label small" for="completedCheck">Completed already</label>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'goals:list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Add Milestone</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
