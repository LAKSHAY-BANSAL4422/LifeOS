{% extends 'base.html' %}
{% block page_title %}New Habit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Track New Habit</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Habit Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Study 2h / Exercise" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Frequency</label>
                    {{ form.frequency }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'habits:list' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Start Tracking</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
