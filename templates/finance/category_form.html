{% extends 'base.html' %}
{% block page_title %}New Category{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Add Finance Category</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Category Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Books / Gym / Coffee" required>
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Category Type</label>
                        {{ form.type }}
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Color</label>
                        {{ form.color }}
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'finance:index' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
