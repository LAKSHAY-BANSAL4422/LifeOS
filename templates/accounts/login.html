{% extends 'base.html' %}
{% block title %}Log in - LifeOS{% endblock %}

{% block unauth_content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 rounded-4 shadow-sm p-4 bg-white" style="border-radius: 16px;">
            <div class="mb-4">
                <h2 class="fw-bold mb-1" style="color: #3b82f6;">LifeOS</h2>
                <h4 class="fw-bold text-dark">Welcome back</h4>
            </div>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light border-1 fs-6" placeholder="" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light border-1 fs-6" placeholder="" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold fs-6 py-2" style="background-color: #3b82f6; border-color: #3b82f6;">
                    Log in
                </button>
            </form>

            <div class="mt-4 text-start">
                <a href="{% url 'register' %}" class="small text-decoration-none" style="color: #3b82f6;">New here? Register</a>
            </div>

            <hr class="my-4 text-muted opacity-25">
            <div class="bg-light p-2 rounded text-center small text-muted">
                <strong>Demo Student:</strong> <code>demo_student</code> / <code>password123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
