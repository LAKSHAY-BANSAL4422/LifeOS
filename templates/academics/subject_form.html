{% extends 'base.html' %}
{% block page_title %}Add Subject{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Add Subject</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Subject Name</label>
                    {{ form.name }}
                    <input type="text" name="name" class="form-control" placeholder="e.g. Operating Systems" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Course Code</label>
                        <input type="text" name="code" class="form-control" placeholder="e.g. 15B11CI512" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Credits</label>
                        <input type="number" step="0.5" name="credits" class="form-control" value="4.0" required>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Semester</label>
                        <input type="number" name="semester" class="form-control" value="5" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Color Tag</label>
                        <input type="color" name="color" class="form-control form-control-color w-100" value="#3b82f6">
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'academics:index' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Subject</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
