{% extends 'base.html' %}
{% block page_title %}Set Monthly Budget{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Set Monthly Category Budget</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Expense Category</label>
                    {{ form.category }}
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Month (YYYY-MM)</label>
                        <input type="text" name="month" class="form-control" placeholder="2026-11" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Monthly Limit (Rs)</label>
                        <input type="number" step="50" name="monthly_limit" class="form-control" placeholder="e.g. 1500" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'finance:index' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Budget</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
