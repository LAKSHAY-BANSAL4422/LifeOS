{% extends 'base.html' %}
{% block page_title %}Schedule Event{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Schedule Calendar Event</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Event Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. FSD Lab Viva / Doctor Appointment" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Event Type</label>
                        {{ form.type }}
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Start Date & Time</label>
                        {{ form.start }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">End Date & Time (Optional)</label>
                    {{ form.end }}
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Description</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'planner:calendar' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Event</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
