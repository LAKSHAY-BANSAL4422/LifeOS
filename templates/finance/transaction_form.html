{% extends 'base.html' %}
{% block page_title %}Add Transaction{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="lifeos-card">
            <h5 class="fw-bold mb-3">Record Income / Expense</h5>
            <form method="post">
                {% csrf_token %}
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Type</label>
                        {{ form.type }}
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Amount (Rs)</label>
                        <input type="number" step="0.5" name="amount" class="form-control" placeholder="e.g. 120" required>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Category</label>
                        {{ form.category }}
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-secondary">Date</label>
                        {{ form.date }}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Note / Description</label>
                    <input type="text" name="note" class="form-control" placeholder="e.g. Canteen lunch">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'finance:index' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="background-color: #3b82f6;">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
